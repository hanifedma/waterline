<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost at sea — Waterline</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
<style>
  .lost {
    min-height: 84dvh; display: grid; place-content: center;
    justify-items: center; gap: 12px; text-align: center;
    max-width: var(--maxw); margin-inline: auto; padding: 24px 18px;
  }
  .lost__mark { font-size: 44px; line-height: 1; }
  .lost h1 { font-size: clamp(22px, 6vw, 30px); }
  .lost p { color: var(--muted); max-width: 40ch; font-size: 14px; }
  .lost .btn { margin-top: 6px; text-decoration: none; }
</style>
</head>
<body>

<main class="lost">
  <span class="lost__mark" aria-hidden="true">💧</span>
  <h1 id="t">Lost at sea</h1>
  <p id="p">That page drifted off. There's nothing here but open water.</p>
  <a class="btn btn-primary btn-lg" href="./" id="b">Back to your fast</a>
</main>

<script>
  // Match the app's theme and language choices — no modules here.
  const root = document.documentElement;
  root.dataset.theme = localStorage.getItem("waterline:theme")
    || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

  const saved = localStorage.getItem("waterline:lang");
  const lang = (saved === "en" || saved === "ko") ? saved
    : ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en");
  root.lang = lang;

  if (lang === "ko") {
    document.title = "망망대해 — Waterline";
    document.getElementById("t").textContent = "길을 잃었어요";
    document.getElementById("p").textContent = "그 페이지는 어디론가 흘러가 버렸습니다. 여기엔 넓은 바다뿐이에요.";
    document.getElementById("b").textContent = "단식으로 돌아가기";
  }
</script>
</body>
</html>
